<div class="ct-page-container ct-clients-page">
  <div class="ct-page-header">
    <mat-checkbox [(ngModel)]="showJiraTable" (ngModelChange)="onToggle()">
        Jira Enable
    </mat-checkbox>

    <div *ngIf="showJiraTable" (click)="openConnectionDialog()" class="ct-add-link">
      <a class="ct-manage-add" style="padding-top: 3px;" >Create New Jira Setting</a>
    </div>
  </div>
<div class="ct-data-table-wrapper">
  <p-table
  class="ct-grid-container ct-grid-row-border"
  *ngIf="showJiraTable"
  [value] = "tableData">
  <ng-template pTemplate="header">
    <tr>
      <th>
        Setting name
      </th>
      <th>
        Api Token
      </th>
      <th>
        Domain
      </th>
      <th>
        User Email
      </th>
      <th>
        Edit
      </th>
      <th>
        Delete
      </th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
    <tr>
      <td class="ct-info-col">{{row.settingName}}</td>
      <td>{{row.apiToken}}</td>
      <td>{{row.domain}}</td>
      <td class="ct-info-col">{{row.userEmail}}</td>
      <td class="ct-small-padding">
          <a class="ct-grid-settings-icon" (click) = "openConnectionDialog(row)"></a>
      </td>
      <td>
        <a class="fa fa-times" (click) = "deleteSetting(rowIndex)"></a>
      </td>
    </tr>
  </ng-template>
  </p-table>
</div>
</div>
