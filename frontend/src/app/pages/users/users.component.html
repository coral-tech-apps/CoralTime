<div class="ct-grid-search-filter">
  <input class="ct-input-element" placeholder="Search user..." [(ngModel)]="filterStr" (input)="filterTable($event.target.value)">
  <i class="fa fa-search"></i>
</div>

<div #pageContainer class="ct-page-container ct-users-page">
  <div class="ct-page-header">
      <h3 class="ct-header">Users</h3>

      <div class="ct-page-tabs">
          <a (click)="toggleTab(true)" [class.ct-active-tab]="isActiveTab">Active Users</a>
          <a (click)="toggleTab(false)" [class.ct-active-tab]="!isActiveTab">Inactive Users</a>
      </div>

      <div *ctIsGranted="'AddMember'" (click)="openUserDialog()" class="ct-add-link">
          <a class="ct-manage-add">Create New User</a>
      </div>
  </div>
  <!--[resizeObservable]="resizeObservable"-->
  <div class="ct-data-table-wrapper" (window:resize)="onResize()">
      <p-table #tableRef class="ct-grid-container ct-grid-row-border"

               [value]="pagedResult?.data"

               scrollable="true" [sortField]="'fullName'"
               [responsive]="true" [lazy]="true"
               [loading]="!isAllUsers"
               (onLazyLoad)="loadLazy($event)"
               (onMoreContent)="loadLazy()"
               (onEndScroll)="onEndScroll()">

          <ng-template pTemplate="header">
              <tr>
                  <th pSortableColumn="fullName" class="ct-info-col">
                      Full Name <p-sortIcon field="fullName"></p-sortIcon>
                  </th>
                  <th pSortableColumn="email">Email <p-sortIcon field="email"></p-sortIcon></th>
                  <th pSortableColumn="userName" class="ct-info-col">
                      Username <p-sortIcon field="userName"></p-sortIcon>
                  </th>
                  <th class="ct-info-col">Role</th>
                  <th class="ct-info-col ct-small-padding">Projects</th>
                  <th class="ct-small-padding">Actions</th>
              </tr>
          </ng-template>

          <ng-template pTemplate="body" let-user>
              <tr>
                  <td class="ct-info-col">
                      <span (click)="openUserDialog(user)" class="ct-grid-userpic">
                          <ct-user-pic [urlIcon]="user.urlIcon"></ct-user-pic>
                      </span>
                      <span (click)="openUserDialog(user)" class="ct-grid-link-text" title="{{user.userName}}">
                          {{user.fullName}}
                      </span>
                  </td>
                  <td>{{user.email}}</td>
                  <td class="ct-info-col">{{user.userName}}</td>
                  <td class="ct-info-col"><span class="ct-lowercase">{{user.role}}</span></td>
                  <td class="ct-info-col">
                      <a *ctIsGranted="'EditMember'" class="ct-grid-link ct-grid-count" (click)="openProjectAssignmentDialog(user)">
                          {{user.projectsCount}}
                          <span class="ct-manage-text">Manage</span>
                      </a>
                  </td>
                  <td>
                      <a *ngIf="user.id !== currentUserId && user.id !== impersonateUserId"
                         class="ct-edit-timesheet-icon" (click)="impersonateMember(user)">
                      </a>
                  </td>
              </tr>
          </ng-template>
      </p-table>
  </div>
</div>
