<div class="ct-dialog ct-data-dialog">
  <div class="ct-dialog-title">
      <span>Project assignment for</span><span>{{ user?.fullName }}</span>
      <button class="ct-dialog-close" mat-dialog-close ctClickClose></button>
  </div>

  <div class="ct-search-container">
      <div class="ct-grid-search-filter">
          <input class="ct-input-element" placeholder="Search to add or remove projects" [(ngModel)]="filterStr"
                 (input)="filterTable($event.target.value)">
          <i class="ct-search-icon"></i>
      </div>
  </div>

  <div class="ct-grid" #grid>
      <div class="ct-popup-table-wrapper" (window:resize)="onResize()">
          <!-- Assigned Projects -->
          <p-table #assignedProjectsTable class="ct-grid-container ct-grid-row-border ct-grid-blue"
                   [value]="assignedProjectsPagedResult?.data"
                   scrollable="true" [sortField]="'projectName'"
                   [responsive]="true" [lazy]="true"
                   [loading]="!isAllAssignedProjects"
                   (onLazyLoad)="updateAssignedProjects($event)"
                   (onMoreContent)="updateAssignedProjects()"
                   (onEndScrollEvent)="onAssignedProjectsEndScroll()">
              <ng-template pTemplate="header">
                  <tr>
                      <th pSortableColumn="projectName" style="width:600px;">Project <p-sortIcon field="projectName"></p-sortIcon></th>
                      <th style="width:180px;">Access Level</th>
                      <th>Actions</th>
                  </tr>
              </ng-template>

              <ng-template pTemplate="body" let-userProject>
                  <tr>
                      <td>{{ userProject.projectName }}</td>
                      <td>
                          <ct-select class="ct-users-project-edit-role ct-select-ellipse ng-untouched ng-valid ng-star-inserted ng-dirty" *ngIf="userProject.id" [(ngModel)]="userProject.role"
                                     [options]="projectRoles" (change)="changeRole(userProject, $event.source.el.nativeElement)">
                          </ct-select>
                          <ct-select class="ct-users-project-edit-role ct-select-ellipse ng-untouched ng-valid ng-star-inserted ng-dirty" *ngIf="!userProject.id" [(ngModel)]="userProject.role"
                                     [options]="projectRoles" (change)="assignToPublic(userProject, $event.source.el.nativeElement)">
                          </ct-select>
                      </td>
                      <td>
                          <a *ngIf="userProject.isProjectPrivate" (click)="removeFromUser(userProject, $event.target)">
                              <i class="material-icons">clear</i>
                          </a>
                          <span *ngIf="!userProject.isProjectPrivate">Public</span>
                      </td>
                  </tr>
              </ng-template>
          </p-table>

          <!-- Not Assigned Projects -->
          <p-table #notAssignedProjectsTable class="ct-grid-container ct-grid-row-border"
                   [value]="notAssignedProjectsPagedResult?.data"
                   scrollable="true" [sortField]="'name'"
                   [responsive]="true" [lazy]="true"
                   [loading]="!isAllNotAssignedProjects"
                   (onLazyLoad)="updateNotAssignedProjects($event)"
                   (onMoreContent)="updateNotAssignedProjects()"
                   (onEndScrollEvent)="onNotAssignedProjectsEndScroll()">
              <ng-template pTemplate="header">
                  <tr>
                      <th pSortableColumn="name" style="width:780px;">Unassigned Projects <p-sortIcon field="name"></p-sortIcon></th>
                      <th>Actions</th>
                  </tr>
              </ng-template>

              <ng-template pTemplate="body" let-project>
                  <tr>
                      <td>{{ project.name }}</td>
                      <td>
                          <span class="ct-grid-button" (click)="addToUser(project, $event.target)">Assign to User</span>
                      </td>
                  </tr>
              </ng-template>
          </p-table>
      </div>
  </div>
</div>
