<div class="ct-dialog ct-data-dialog">
  <div class="ct-dialog-title">
      <span>Projects by</span><span>{{jiraSetting.settingName}}</span>
      <div *ngIf="!isAvaliableLoadProjects" class="ct-hint-text">
        Select Jira setting before choosing project.
      </div>
      <button class="ct-dialog-close" mat-dialog-close ctClickClose></button>
  </div>

  <button [class.disabled]="!isAvaliableLoadProjects" mat-raised-button class="ct-blue-button"  (click)="loadNewProjects()">
    Update Jira projects
  </button>


  <div class="ct-search-container">
      <div class="ct-grid-search-filter">
          <input  [class.disabled]="!isAvaliableLoadProjects" class="ct-input-element" #gb placeholder="Search to link or delete link projects"
                [(ngModel)]="filterStr"
                (input)="onGlobalFilter($event.target.value)">
          <i class="ct-search-icon"></i>
      </div>
  </div>

  <div class="ct-grid" #grid>
      <div class="ct-popup-table-wrapper">
        <p-table #assignedTable class="ct-grid-container ct-grid-row-border ct-grid-blue"
                   [value]="assignedJiraProjects?.data"
                   [sortField]="'jiraProjectName'"
                   [scrollable]="true"
                   [scrollHeight]="'calc((100vh - 220px) / 2)'"
                   [rows]="assignedProjectsLastEvent.rows"
                   [lazy]="true"
                   [loading]="firstLoadingAssignedJiraProject"
                   (onLazyLoad)="updateAssignedProjects($event)"
                   ctPaginationScrolling
                   [isLoading]="updatingAssignedJiraProject"
                   (onEndScroll)="onEndScrollAssigned()">
              <ng-template pTemplate="header">
                  <tr>
                      <th pSortableColumn="jiraProjectName" [style]="{'width':'330px'}" class="ct-info-col">
                          Jira project name
                          <p-sortIcon field="jiraProjectName"></p-sortIcon>
                      </th>
                      <th pSortableColumn="projectName" [style]="{'width':'470px'}">
                          Project name
                          <p-sortIcon field="projectName"></p-sortIcon>
                      </th>
                      <th>
                          Remove
                      </th>
                  </tr>
              </ng-template>

              <ng-template pTemplate="body" let-jiraProject>
                  <tr>
                      <td class="ct-info-col">
                            {{jiraProject.jiraProjectName}}
                      </td>
                      <td>{{jiraProject.projectName}}</td>
                      <td>
                        <i class="fa fa-times" (click)="unLink(jiraProject)" style="cursor: pointer;"></i>
                      </td>
                  </tr>
              </ng-template>
          </p-table>

          <p-table #notAssignTable class="ct-grid-container ct-grid-row-border"
                   [value]="notAssignedJiraProjects?.data"
                   [sortField]="'key'"
                   [scrollable]="true"
                   [scrollHeight]="'calc((100vh - 220px) / 2)'"
                   [rows]="notAssignedProjectsLastEvent.rows"
                   [lazy]="true"
                   [loading]="firstLoadingNotAssignedJiraProject"
                   (onLazyLoad)="updateNotAssignedProjects($event)"
                   ctPaginationScrolling
                   [isLoading]="updatingNotAssignedJiraProject"
                   (onEndScroll)="onEndScrollNotAssigned()">

              <ng-template pTemplate="header">
                  <tr>
                    <th pSortableColumn="name" [style]="{'width':'330px'}">
                      Name
                      <p-sortIcon field="name"></p-sortIcon>
                    </th>
                    <th pSortableColumn="key" [style]="{'width':'400px'}" class="ct-info-col">
                        Key
                        <p-sortIcon field="key"></p-sortIcon>
                    </th>
                    <th>
                      Projects
                    </th>
                  </tr>
              </ng-template>

              <ng-template pTemplate="body" let-jiraProject>
                  <tr>
                    <td class="ct-info-col">{{jiraProject.name}}</td>
                    <td>{{jiraProject.key}}</td>
                    <td>
                      <ct-select [name]="'defaultProject'"
                                  class="ct-users-project-edit-role ct-report-filters-block"
                                  [displayName]="'name'"
                                  [trackBy]="'id'"
                                  [defaultValue] = "'choose project'"
                                  [options]="projects"
                                  (change)="onSelectionChange($event, jiraProject)">
                      </ct-select>
                    </td>
                  </tr>
              </ng-template>
          </p-table>
      </div>
  </div>
</div>
