<div class="ct-page-container ct-clients-page ct-max-width">
  <div class="ct-page-header">
    <mat-checkbox [checked]="showJiraTable" (change)="onToggle($event)">
        Jira Enable
    </mat-checkbox>
  </div>
<div class="ct-data-table-wrapper">
  <p-table
  class="ct-grid-container ct-grid-row-border"
  *ngIf="showJiraTable"
  [value] = "tableData">
  <ng-template pTemplate="header">
    <tr>
      <th>Setting name</th>
      <th>Api Token</th>
      <th>Domain</th>
      <th>User Email</th>
      <th>Account id</th>
      <th>Token</th>
      <th>Projects</th>
      <th>Action</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-row let-rowIndex="rowIndex">
    <tr>
      <td class="ct-info-col">{{row.settingName}}</td>
      <td>
        <i class="fa"
          [ngClass]="row.apiTokenStatus ? 'fa-check' : 'fa-times'"
          [style.color]="row.apiTokenStatus ? 'green' : 'red'"
          >
        </i>
      </td>
      <td>{{row.domain}}</td>
      <td class="ct-info-col">{{row.userEmail}}</td>
      <td>
        <i class="fa"
          [ngClass]="row.isEnableConntection ? 'fa-check' : 'fa-times'"
          [style.color]="row.isEnableConntection ? 'green' : 'red'"
          ></i>
      </td>
      <td class="ct-small-padding">
        <button class="ct-action-button ct-bold" (click)="openConnectionDialog(row)">
          <span [style]="{'margin-top': '7px'}">************</span>
          <i class="ct-edit-icon" [style]="{'width': '20px', 'height': '20px'}"></i>
        </button>
      </td>
      <td class="ct-small-padding">
        <button class="ct-action-button ct-gray-background ct-bold" (click)="onJiraProjectDialog(row)">
          <span>View</span>
          <i class="ct-visible-icon" [style]="{'width': '20px', 'height': '20px'}"></i>
        </button>
      </td>
      <td>
        <button class="ct-action-button ct-light-green-background ct-bold" (click)="checkConncetion(row.jiraSettingId, row.settingName)">
          <span>Verify</span>
          <i class="ct-edit-icon" [style]="{'width': '20px', 'height': '20px'}"></i>
        </button>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="8" class="ct-grid-empty-message">
        Ask your project admin to assign Jira project
      </td>
    </tr>
  </ng-template>
  </p-table>
</div>
</div>
