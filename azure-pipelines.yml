trigger:
- dev

variables:
- group: CoralTime
- name: dockerfilePath
  value: '**/Dockerfile'
- name: tag
  value: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: Dev
  displayName: Deploy to Dev
  dependsOn: Build
  jobs:
  - deployment: DeployToDev
    displayName: Update Dev Manifest in GitOps repo
    environment: dev
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              git config --global user.email "$(gitEmail)"
              git config --global user.name "$(gitUsername)"

              git clone $(gitopsRepoUrl)
              cd coral.gitops/coral-team/coral-time/overlays/dev

              sed -i "s|image: .*/$(imageRepository):.*|image: $(containerRegistry)/$(imageRepository):$(tag)|" deployment.yaml

              echo "Updated image:"
              grep 'image:' deployment.yaml

              git add deployment.yaml
              git commit -m "Update CoralTime Dev image to $(tag)"
              git push origin master
            displayName: Commit Dev image tag

- stage: QA
  displayName: Deploy to QA
  dependsOn: Dev
  jobs:
  - deployment: DeployToQA
    displayName: Update QA Manifest in GitOps repo
    environment: qa
    pool:
      vmImage: $(vmImageName)
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              git config --global user.email "$(gitEmail)"
              git config --global user.name "$(gitUsername)"

              git clone $(gitopsRepoUrl)
              cd coral.gitops/coral-team/coral-time/overlays/qa

              sed -i "s|image: .*/$(imageRepository):.*|image: $(containerRegistry)/$(imageRepository):$(tag)|" deployment.yaml

              echo "Updated image:"
              grep 'image:' deployment.yaml

              git add deployment.yaml
              git commit -m "Update CoralTime QA image to $(tag)"
              git push origin master
            displayName: Commit QA image tag